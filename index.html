        * {

        .container {

        .container::before {

        .app-logo {

            position: relative;

        h1 {

        .version-badge {

        .features-grid {

        .feature-item i {
            color: #10b981;

        }

        .download-btn {

            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.4);
            transition: all 0.35s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.6);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .download-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform 0.5s, opacity 1s;
        }

        .download-btn:focus::after {
            transform: translate(-50%, -50%) scale(4);
            opacity: 0;
            transition: 0s;
        }

        .file-info {
            font-size: 13px;
            color: #6b7280;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;

        .file-info span {
