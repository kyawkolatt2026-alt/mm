<!DOCTYPE html><html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VIRGO VPN — Fast. Private. Secure.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #050608;
        --card: rgba(17, 19, 27, 0.78);
        --border: rgba(255,255,255,0.08);
        --text: #ffffff;
        --muted: #8b91a1;
        --purple: #7c5cff;
        --purple2: #a855f7;
        --green: #21d4a5;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 50% -10%, rgba(124,92,255,.28), transparent 38%),
            radial-gradient(circle at 100% 80%, rgba(33,212,165,.10), transparent 35%),
            #050608;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 25px 16px;
        overflow-x: hidden;
    }

    /* Background lights */

    .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        z-index: 0;
    }

    .orb.one {
        width: 180px;
        height: 180px;
        background: rgba(124,92,255,.16);
        top: 8%;
        left: -70px;
    }

    .orb.two {
        width: 220px;
        height: 220px;
        background: rgba(33,212,165,.08);
        bottom: 5%;
        right: -100px;
    }

    /* Main */

    .wrapper {
        width: 100%;
        max-width: 470px;
        position: relative;
        z-index: 2;
    }

    .card {
        position: relative;
        overflow: hidden;

        background: var(--card);
        border: 1px solid var(--border);

        border-radius: 32px;

        padding: 38px 25px 25px;

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        box-shadow:
            0 35px 90px rgba(0,0,0,.55),
            inset 0 1px rgba(255,255,255,.04);

        animation: cardIn .8s ease;
    }

    @keyframes cardIn {
        from {
            opacity: 0;
            transform: translateY(25px) scale(.97);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Top gradient line */

    .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 12%;
        width: 76%;
        height: 2px;

        background: linear-gradient(
            90deg,
            transparent,
            var(--purple),
            var(--green),
            transparent
        );

        box-shadow: 0 0 25px var(--purple);
    }

    /* Status */

    .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;

        padding: 7px 12px;

        border-radius: 30px;

        background: rgba(33,212,165,.07);
        border: 1px solid rgba(33,212,165,.14);

        color: #7eead0;

        font-size: 11px;
        font-weight: 700;

        letter-spacing: .5px;

        margin-bottom: 25px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;

        background: var(--green);

        box-shadow: 0 0 10px var(--green);

        animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
        0%,100% {
            opacity: 1;
            transform: scale(1);
        }
        50% {
            opacity: .45;
            transform: scale(.7);
        }
    }

    /* Logo */

    .logo-area {
        display: flex;
        justify-content: center;

        margin-bottom: 22px;
    }

    .logo-glow {
        position: relative;
        width: 118px;
        height: 118px;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .logo-glow::before {
        content: "";
        position: absolute;
        inset: -18px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(124,92,255,.32),
                transparent 68%
            );

        filter: blur(10px);

        animation: logoGlow 3s ease-in-out infinite;
    }

    @keyframes logoGlow {
        0%,100% {
            transform: scale(.95);
            opacity: .7;
        }
        50% {
            transform: scale(1.08);
            opacity: 1;
        }
    }

    .logo {
        width: 108px;
        height: 108px;

        object-fit: cover;

        border-radius: 28px;

        position: relative;
        z-index: 2;

        border: 1px solid rgba(255,255,255,.14);

        box-shadow:
            0 20px 45px rgba(0,0,0,.5),
            0 0 35px rgba(124,92,255,.18);
    }

    /* Heading */

    .brand {
        text-align: center;
    }

    .brand h1 {
        font-size: 31px;
        font-weight: 900;

        letter-spacing: -1.3px;

        margin-bottom: 9px;

        background: linear-gradient(
            135deg,
            #ffffff 20%,
            #c4b5fd 70%,
            #8b5cf6
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .brand p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
    }

    .version {
        display: inline-flex;
        align-items: center;
        gap: 6px;

        margin-top: 14px;

        padding: 6px 12px;

        border-radius: 10px;

        background: rgba(124,92,255,.09);

        border: 1px solid rgba(124,92,255,.16);

        color: #b8a9ff;

        font-size: 11px;
        font-weight: 700;
    }

    /* Features */

    .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);

        gap: 8px;

        margin: 28px 0 20px;
    }

    .feature {
        padding: 14px 7px;

        text-align: center;

        background: rgba(255,255,255,.025);

        border: 1px solid rgba(255,255,255,.055);

        border-radius: 16px;

        transition: .3s ease;
    }

    .feature:hover {
        transform: translateY(-3px);
        background: rgba(124,92,255,.07);
        border-color: rgba(124,92,255,.2);
    }

    .feature i {
        display: block;

        font-size: 17px;

        margin-bottom: 8px;

        color: #9b87ff;
    }

    .feature:nth-child(2) i {
        color: #35dfb1;
    }

    .feature:nth-child(3) i {
        color: #60a5fa;
    }

    .feature span {
        display: block;

        color: #b8bcc8;

        font-size: 10px;
        font-weight: 600;
    }

    /* Download */

    .download {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;

        width: 100%;

        padding: 17px;

        border-radius: 18px;

        text-decoration: none;

        color: white;

        font-size: 15px;
        font-weight: 800;

        background:
            linear-gradient(
                135deg,
                #7c5cff,
                #6845e8
            );

        border: 1px solid rgba(255,255,255,.12);

        box-shadow:
            0 15px 35px rgba(99,70,230,.28);

        position: relative;
        overflow: hidden;

        transition: .3s ease;
    }

    .download::before {
        content: "";

        position: absolute;

        top: 0;
        left: -120%;

        width: 70%;
        height: 100%;

        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.2),
            transparent
        );

        transform: skewX(-20deg);

        transition: .7s;
    }

    .download:hover::before {
        left: 140%;
    }

    .download:hover {
        transform: translateY(-3px);

        box-shadow:
            0 20px 45px rgba(99,70,230,.4);
    }

    .download:active {
        transform: scale(.98);
    }

    .download i {
        font-size: 18px;
    }

    /* File info */

    .file-card {
        display: grid;
        grid-template-columns: repeat(3,1fr);

        margin-top: 12px;

        background: rgba(0,0,0,.18);

        border: 1px solid rgba(255,255,255,.045);

        border-radius: 15px;

        padding: 12px 5px;
    }

    .file-item {
        text-align: center;

        border-right: 1px solid rgba(255,255,255,.05);
    }

    .file-item:last-child {
        border-right: none;
    }

    .file-item i {
        color: #72798a;

        font-size: 12px;

        margin-right: 4px;
    }

    .file-item span {
        color: #777e8d;

        font-size: 10px;
        font-weight: 600;
    }

    /* Divider */

    .divider {
        height: 1px;

        margin: 23px 0 17px;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.08),
                transparent
            );
    }

    /* Footer */

    .footer {
        display: flex;
        justify-content: center;
        align-items: center;

        gap: 7px;

        color: #606675;

        font-size: 10px;

        line-height: 1.5;
    }

    .footer i {
        color: var(--green);

        font-size: 11px;
    }

    /* Copyright */

    .copyright {
        text-align: center;

        margin-top: 15px;

        color: #3f4450;

        font-size: 9px;
    }

    /* Mobile */

    @media(max-width: 380px) {

        .card {
            padding: 30px 18px 20px;
            border-radius: 27px;
        }

        .logo {
            width: 95px;
            height: 95px;
        }

        .logo-glow {
            width: 105px;
            height: 105px;
        }

        .brand h1 {
            font-size: 27px;
        }

        .feature {
            padding: 12px 5px;
        }
    }

</style>
